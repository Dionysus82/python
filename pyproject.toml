[project]
name = "harbour-meridian-risk"
version = "0.1.0"
description = "Hackathon proof of concept: synthetic risk intelligence platform for the fictional Harbour Meridian Bank Limited."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "streamlit>=1.40",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pymupdf>=1.24",
    "pandas>=2.2",
    "jinja2>=3.1",
    "reportlab>=4.2",
    "rank-bm25>=0.2.2",
    "numpy>=2.1",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "mypy>=1.13", "pre-commit>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["app", "synthetic_data", "scripts"]
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
warn_redundant_casts = false
no_implicit_optional = true

[tool.alembic]
script_location = "alembic"
